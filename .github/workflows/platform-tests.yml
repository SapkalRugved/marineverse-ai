name: Marine platform tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgis: ['16-3.4', '18-3.6']
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:${{ matrix.postgis }}
        env:
          POSTGRES_DB: marineverse_test
          # Disposable isolated CI service only; no account credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marineverse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: marineverse_test
      PGUSER: postgres
      PGPASSWORD: ''
      PGCONNECT_TIMEOUT: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-platform.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply unchanged frozen schema to disposable database
        run: |
          python - <<'PY'
          from pathlib import Path
          from backend.marine_data.database import connect_to_database
          with connect_to_database(prompt_for_password=False) as connection:
              for path in sorted(Path('database').glob('00[1-7]_*.sql')):
                  connection.execute(path.read_text())
          PY
      - name: Run all tests including PostGIS integrations
        run: python -m pytest -q
      - name: Check whitespace
        run: git diff --check
