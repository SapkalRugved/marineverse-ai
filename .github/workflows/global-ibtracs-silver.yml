name: Global IBTrACS Silver tests
on:
  push:
    branches: [feat/global-ibtracs-silver]
  pull_request:
    paths:
      - "backend/marine_data/cyclones/**"
      - "tests/test_ibtracs_silver.py"
      - "requirements-silver.txt"
      - ".github/workflows/global-ibtracs-silver.yml"
jobs:
  silver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Silver dependencies
        run: python -m pip install -r requirements-silver.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p test_ibtracs_silver.py -v
